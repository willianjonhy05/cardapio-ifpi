<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Painel Administrativo | Cardápio Refeitório IFPI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .portion-check-card {
            border: 2px solid #E2E8F0;
            border-radius: 0.75rem;
            padding: 0.65rem 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }
        .portion-check-card:hover {
            border-color: var(--ifpi-green);
        }
        .portion-check-input:checked + .portion-check-card {
            border-color: var(--ifpi-green);
            background-color: var(--ifpi-green-light);
            color: var(--ifpi-green-dark);
            font-weight: 600;
        }
        .icon-option-btn {
            width: 44px;
            height: 44px;
            border: 2px solid #E2E8F0;
            border-radius: 0.65rem;
            background: #FFF;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .icon-option-btn.selected {
            border-color: var(--ifpi-green);
            background-color: var(--ifpi-green);
            color: #FFF;
        }
        .nav-pills .nav-link {
            color: var(--text-main);
            font-weight: 600;
        }
        .nav-pills .nav-link.active {
            background-color: var(--ifpi-green);
            color: #FFF;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho Administrativo -->
    <header class="ifpi-header text-white shadow-sm">
        <div class="container py-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-sliders2 fs-4"></i>
                <div>
                    <h1 class="h5 mb-0 fw-bold">Gestão do Cardápio</h1>
                    <small class="opacity-75">IFPI • Campus Teresina Central</small>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="./index.html" target="_blank" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-box-arrow-up-right me-1"></i> Ver Site
                </a>
                <button id="btn-logout" type="button" class="btn btn-sm btn-danger fw-semibold">
                    <i class="bi bi-box-arrow-right me-1"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <main class="container my-4">

        <!-- Toast / Alerta Global de Feedback -->
        <div id="admin-feedback" class="alert d-none shadow-sm rounded-3" role="alert"></div>

        <!-- Abas de Navegação do Painel -->
        <ul class="nav nav-pills bg-white p-2 rounded-4 shadow-sm mb-4 gap-1" id="adminTabs" role="tablist">
            <li class="nav-item flex-fill text-center" role="presentation">
                <button class="nav-link active w-100 rounded-3" id="tab-refeicoes" data-bs-toggle="pill" data-bs-target="#pane-refeicoes" type="button" role="tab">
                    <i class="bi bi-calendar-check me-1"></i> Refeições da Semana
                </button>
            </li>
            <li class="nav-item flex-fill text-center" role="presentation">
                <button class="nav-link w-100 rounded-3" id="tab-porcoes" data-bs-toggle="pill" data-bs-target="#pane-porcoes" type="button" role="tab">
                    <i class="bi bi-egg-fried me-1"></i> Catálogo de Porções
                </button>
            </li>
            <li class="nav-item flex-fill text-center" role="presentation">
                <button class="nav-link w-100 rounded-3" id="tab-nao-letivos" data-bs-toggle="pill" data-bs-target="#pane-nao-letivos" type="button" role="tab">
                    <i class="bi bi-calendar-x me-1"></i> Dias Não Letivos
                </button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">

            <!-- ==============================================================
                 ABA 1: REFEIÇÕES DA SEMANA (CADASTRAR / ATUALIZAR / EXCLUIR)
                 ============================================================== -->
            <div class="tab-pane fade show active" id="pane-refeicoes" role="tabpanel">
                <div class="row g-4">
                    <!-- Formulário de Refeição -->
                    <div class="col-12 col-lg-5">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                                <h2 id="meal-form-title" class="h6 fw-bold mb-0 text-ifpi-dark">
                                    <i class="bi bi-plus-circle-fill text-ifpi-green me-1"></i> Cadastrar / Editar Refeição
                                </h2>
                                <button id="btn-cancel-edit-meal" type="button" class="btn btn-sm btn-link text-danger text-decoration-none d-none">
                                    Cancelar edição
                                </button>
                            </div>
                            <div class="card-body p-4">
                                <form id="meal-form">
                                    <input type="hidden" id="editing-meal-id">

                                    <div class="row g-3 mb-3">
                                        <div class="col-12 col-sm-6">
                                            <label for="meal-date" class="form-label small fw-semibold">Data da Refeição</label>
                                            <input type="date" id="meal-date" class="form-control" required>
                                        </div>
                                        <div class="col-12 col-sm-6">
                                            <label for="meal-type" class="form-label small fw-semibold">Tipo de Refeição</label>
                                            <select id="meal-type" class="form-select" required>
                                                <option value="almoco">Almoço (11h30–13h30)</option>
                                                <option value="jantar">Jantar (17h00–19h00)</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="d-flex justify-content-between align-items-center mb-2">
                                            <label class="form-label small fw-semibold mb-0">Selecione as Porções Servidas:</label>
                                            <span id="selected-count-badge" class="badge bg-secondary">0 selecionadas</span>
                                        </div>
                                        <div id="meal-portions-selector" class="row g-2" style="max-height: 310px; overflow-y: auto;">
                                            <!-- Checkboxes de porções gerados via JS -->
                                        </div>
                                    </div>

                                    <button id="btn-save-meal" type="submit" class="btn bg-ifpi-green text-white w-100 py-2 fw-semibold rounded-3">
                                        <i class="bi bi-check2-circle me-1"></i> Salvar Refeição
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Listagem das Refeições Cadastradas -->
                    <div class="col-12 col-lg-7">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                                <h2 class="h6 fw-bold mb-0 text-ifpi-dark">
                                    <i class="bi bi-list-ul text-ifpi-green me-1"></i> Refeições Cadastradas (Semana Vigente)
                                </h2>
                                <span id="admin-week-label" class="badge bg-light text-dark border"></span>
                            </div>
                            <div class="card-body p-4">
                                <div id="admin-meals-list" class="d-flex flex-column gap-3">
                                    <!-- Lista gerada via JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==============================================================
                 ABA 2: CATÁLOGO DE PORÇÕES (COM ÍCONES)
                 ============================================================== -->
            <div class="tab-pane fade" id="pane-porcoes" role="tabpanel">
                <div class="row g-4">
                    <div class="col-12 col-md-5">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                                <h2 id="portion-form-title" class="h6 fw-bold mb-0 text-ifpi-dark">Nova Porção</h2>
                                <button id="btn-cancel-edit-portion" type="button" class="btn btn-sm btn-link text-danger text-decoration-none d-none">
                                    Cancelar
                                </button>
                            </div>
                            <div class="card-body p-4">
                                <form id="portion-form">
                                    <input type="hidden" id="editing-portion-id">
                                    <div class="mb-3">
                                        <label for="portion-name" class="form-label small fw-semibold">Nome da Porção</label>
                                        <input type="text" id="portion-name" class="form-control" placeholder="Ex: Arroz à Grega, Bife Acebolado..." required>
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label small fw-semibold d-block">Escolha um Ícone:</label>
                                        <input type="hidden" id="portion-icon" value="bi-egg-fried">
                                        <div id="icon-picker-grid" class="d-flex flex-wrap gap-2">
                                            <!-- Botões de ícones gerados via JS -->
                                        </div>
                                    </div>

                                    <button type="submit" class="btn bg-ifpi-green text-white w-100 py-2 fw-semibold rounded-3">
                                        <i class="bi bi-save me-1"></i> Salvar Porção
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-7">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-3 px-4">
                                <h2 class="h6 fw-bold mb-0 text-ifpi-dark">Porções Disponíveis no Sistema</h2>
                            </div>
                            <div class="card-body p-4">
                                <div id="admin-portions-list" class="row g-2">
                                    <!-- Lista de porções gerada via JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==============================================================
                 ABA 3: DIAS NÃO LETIVOS (JUSTIFICATIVAS)
                 ============================================================== -->
            <div class="tab-pane fade" id="pane-nao-letivos" role="tabpanel">
                <div class="row g-4">
                    <div class="col-12 col-md-5">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-3 px-4">
                                <h2 class="h6 fw-bold mb-0 text-ifpi-dark">Registrar Dia Não Letivo</h2>
                            </div>
                            <div class="card-body p-4">
                                <form id="non-school-form">
                                    <div class="mb-3">
                                        <label for="non-school-date" class="form-label small fw-semibold">Data</label>
                                        <input type="date" id="non-school-date" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="non-school-reason" class="form-label small fw-semibold">Justificativa</label>
                                        <input type="text" id="non-school-reason" class="form-control" placeholder="Ex: Feriado Nacional, Recesso Escolar..." required>
                                    </div>
                                    <button type="submit" class="btn btn-warning fw-semibold w-100 py-2 rounded-3">
                                        <i class="bi bi-calendar-x me-1"></i> Registrar Justificativa
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-7">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header bg-white border-bottom py-3 px-4">
                                <h2 class="h6 fw-bold mb-0 text-ifpi-dark">Dias Não Letivos Cadastrados</h2>
                            </div>
                            <div class="card-body p-4">
                                <div id="admin-non-school-list" class="d-flex flex-column gap-2">
                                    <!-- Lista gerada via JS -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/admin.js"></script>
</body>
</html>
