<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acesso Administrativo | Refeitório IFPI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4 px-3">

    <main class="w-100" style="max-width: 420px;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="ifpi-header text-white text-center p-4">
                <div class="bg-white text-ifpi-green rounded-circle d-inline-flex align-items-center justify-content-center mb-2 shadow-sm" style="width: 56px; height: 56px;">
                    <i class="bi bi-shield-lock-fill fs-3"></i>
                </div>
                <h1 class="h5 fw-bold mb-1">Área Administrativa</h1>
                <p class="small opacity-75 mb-0">Refeitório IFPI • Campus Teresina Central</p>
            </div>

            <div class="card-body p-4">
                <div id="login-alert" class="alert alert-danger small py-2 d-none" role="alert"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-secondary">E-mail Institucional</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="email" placeholder="admin@ifpi.edu.br" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold text-secondary">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>

                    <button id="btn-login" type="submit" class="btn bg-ifpi-green text-white w-100 py-2 fw-semibold rounded-3 shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Painel
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 border-top">
                    <a href="./index.html" class="small text-decoration-none text-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Voltar para o cardápio público
                    </a>
                </div>
            </div>
        </div>

        <p class="text-center text-muted small mt-3 mb-0">
            Primeira Classe - Desenvolvimento de Sistemas
        </p>
    </main>

    <script type="module">
        import { supabase } from './js/supabase-config.js';

        // Se já estiver logado, vai direto para o painel
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            window.location.href = './admin.html';
        }

        const loginForm = document.getElementById('login-form');
        const loginAlert = document.getElementById('login-alert');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginAlert.classList.add('d-none');
            btnLogin.disabled = true;
            btnLogin.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Autenticando...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                loginAlert.textContent = 'E-mail ou senha inválidos. Tente novamente.';
                loginAlert.classList.remove('d-none');
                btnLogin.disabled = false;
                btnLogin.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Painel';
            } else {
                window.location.href = './admin.html';
            }
        });
    </script>
</body>
</html>
